name: Build Tensorflow

on:
  repository_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Tensorflow source code
      uses: actions/checkout@v3
      with:
        path: Tensorflow
        set-safe-directory: True

    - name: Checkout Meadow source code
      uses: actions/checkout@v3
      with:
        repository: WildernessLabs/Meadow
        path: Meadow
        set-safe-directory: True
        submodules: True
        token: ${{ secrets.CI_ACCESS_TOKEN }}

    - name: Build Docker image for the OS build
      run: docker build -t nuttx-build -f Meadow/Dockerfile .

    - name: Build NuttX for Tensorflow
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build export MEADOW_ADDITIONAL_MAKE_OPTIONS="-j1" && ./Meadow/build.sh --force

    - name: Build Tensorflow DLL
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./Tensorflow/build.sh

    - name: Create zip file
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./Tensorflow/create-zip.sh

    - name: Create release
      uses: actions/create-release@v1
      id: create_release
      with:
        tag_name: ${{ github.ref }}
        release_name: ${{ github.ref }}
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.CI_ACCESS_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Tensorflow.zip
        asset_name: ./Tensorflow.zip
        asset_content_type: application/gzip
