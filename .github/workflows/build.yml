name: Build Tensorflow

on:
  repository_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Tensorflow source code
      uses: actions/checkout@v3
      with:
        path: Tensorflow
        set-safe-directory: True

    - name: Checkout Meadow source code
      uses: actions/checkout@v3
      with:
        repository: WildernessLabs/Meadow
        path: Meadow
        set-safe-directory: True
        submodules: True
        token: ${{ secrets.CI_ACCESS_TOKEN }}
        ref: DockerToSupportTensorflow

    - name: Build Docker image for the OS build
      run: docker build -t nuttx-build -f Meadow/Dockerfile .

    - name: Build NuttX for Tensorflow
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./Meadow/build.sh --force

    - name: Build Tensorflow DLL
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./Tensorflow/build.sh
